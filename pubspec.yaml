name: acadia
description: >-
  Acadia — Flutter academic productivity app for students: semester-scoped courses,
  tasks, deadlines, study timer, mood & stress tracking, analytics, decision engine,
  AI assistant, and smart notifications (Riverpod, GoRouter, Supabase, Firebase).
publish_to: 'none'
version: 1.0.4+27

environment:
  sdk: ^3.10.4

dependencies:
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  heroicons: ^0.10.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  haptic_feedback: ^0.6.5
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.1.0
  flutter_timezone: ^4.1.1
  timezone: ^0.11.1
  shared_preferences: ^2.2.2
  phosphor_flutter: ^2.1.0
  workmanager: ^0.9.0+3
  background_fetch: ^1.3.8
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  table_calendar: ^3.0.9
  upgrader: ^11.4.0
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# phosphor_flutter 2.1.0 (latest on pub.dev, unfixed upstream) subclasses
# Flutter's IconData, which is now a `final class` and can't be extended.
# Vendored + patched locally in third_party/phosphor_flutter.
#
# workmanager_apple 0.9.1+2 ships its Package.swift at ios/Package.swift, but
# Flutter's tooling only recognizes SPM support at ios/<name>/Package.swift,
# so it's reported as CocoaPods-only despite genuinely supporting SPM.
# Vendored + patched locally in third_party/workmanager_apple.
dependency_overrides:
  phosphor_flutter:
    path: third_party/phosphor_flutter
  workmanager_apple:
    path: third_party/workmanager_apple

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/onboarding/
    - assets/sounds/
