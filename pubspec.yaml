name: acadia
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  heroicons: ^0.10.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/onboarding/
