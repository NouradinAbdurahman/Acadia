name: acadia
description: >-
  Acadia — Flutter academic productivity app for students: semester-scoped courses,
  tasks, deadlines, study timer, mood & stress tracking, analytics, decision engine,
  AI assistant, and smart notifications (Riverpod, GoRouter, Supabase, Firebase).
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.10.4

dependencies:
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  heroicons: ^0.10.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^4.1.1
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  phosphor_flutter: ^2.1.0
  workmanager: ^0.7.0
  background_fetch: ^1.3.8
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/onboarding/
    - assets/sounds/
